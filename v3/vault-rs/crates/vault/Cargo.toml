[package]
name = "vault"
version = "0.1.0"
edition = "2021"
description = "One concrete composition of vault-core: Bitwarden credentials x Playwright page x heuristic detector x in-process TOTP x file allowlist. Each impl is a default-on feature."

[lib]
name = "vault"
path = "src/lib.rs"

[[bin]]
name = "vault"
path = "src/main.rs"
# The binary needs the CLI plus every default-impl slot it wires together.
required-features = ["cli", "bitwarden", "web", "totp", "allowlist"]

[dependencies]
vault-core = { path = "../vault-core" }
serde_json = "1"                                                   # always: PageDriver eval + JSON output
thiserror = "1"                                                   # DriverError / DetectError in the web surface
serde = { version = "1", features = ["derive"], optional = true } # bitwarden item JSON + passkey request
totp-rs = { version = "5", optional = true }                      # totp generator
clap = { version = "4", features = ["derive", "env"], optional = true } # cli
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"], optional = true } # passkey ES256 assertion
sha2 = { version = "0.10", optional = true }                      # passkey: SHA-256
base64 = { version = "0.22", optional = true }                    # passkey: challenge / key encoding

[features]
default = ["cli", "bitwarden", "web", "totp", "allowlist", "passkey"]
bitwarden = ["dep:serde"] # PasswordManager via `bw`
web = []                  # FormFiller via playwright-cli driver + heuristic detector
totp = ["dep:totp-rs"]    # OtpGenerator, in-process RFC 6238
allowlist = []            # TargetPolicy, file-backed
passkey = ["web", "dep:serde", "dep:p256", "dep:sha2", "dep:base64"] # PageInjection WebAuthn
cli = ["dep:clap"]        # the `vault` binary
